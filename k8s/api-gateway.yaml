apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: banking-platform
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ai-banking/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: banking-config
            - secretRef:
                name: banking-secrets
          env:
            - name: DB_URL
              value: "jdbc:postgresql://postgres:5432/auth_db"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8081"
            - name: KYC_SERVICE_URL
              value: "http://kyc-service:8082"
            - name: FRAUD_SERVICE_URL
              value: "http://fraud-service:8083"
            - name: LOAN_SERVICE_URL
              value: "http://loan-service:8084"
            - name: SUPPORT_SERVICE_URL
              value: "http://support-service:8085"
            - name: DECISION_SERVICE_URL
              value: "http://decision-service:8086"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: banking-platform
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
