name: ai-banking-operations-platform

# =============================================================================
# AI Banking Operations Platform — Docker Compose
#
# One command brings up the entire platform:
#   docker compose up --build
#
#   Frontend        http://localhost:3000
#   API Gateway     http://localhost:8080
#   PostgreSQL      localhost:5432
#   Kafka (host)    localhost:9092   |   Kafka (inside Docker) kafka:29092
#   Redis           localhost:6379
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — one instance, one database per service
  # Databases and the `bank` application user are created by
  # ./infra/postgres/init.sql on first start (empty pgdata volume only).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: banking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - banking-network

  # ---------------------------------------------------------------------------
  # Kafka — single-node KRaft mode (no ZooKeeper)
  # Dual listeners:
  #   PLAINTEXT       kafka:29092   containers on the Docker network
  #   PLAINTEXT_HOST  localhost:9092  tools running on the host machine
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: banking-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - banking-network

  # ---------------------------------------------------------------------------
  # Redis 7 — caching, session support and fast lookups
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: banking-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - banking-network

  # ---------------------------------------------------------------------------
  # Auth Service — 8081 / auth_db
  # ---------------------------------------------------------------------------
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: banking-auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: ${DB_USERNAME:-bank}
      DB_PASSWORD: ${DB_PASSWORD:-bankpass}
      KAFKA_BOOTSTRAP_SERVICES: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-banking-platform-dev-secret-change-in-production-please-use-a-long-random-value}
      AI_MODE: ${AI_MODE:-fallback}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o-mini}
    ports:
      - "8081:8081"
    networks:
      - banking-network

  # ---------------------------------------------------------------------------
  # KYC Service — 8082 / kyc_db
  # ---------------------------------------------------------------------------
  kyc-service:
    build:
      context: .
      dockerfile: kyc-service/Dockerfile
    container_name: banking-kyc-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/kyc_db
      DB_USERNAME: ${DB_USERNAME:-bank}
      DB_PASSWORD: ${DB_PASSWORD:-bankpass}
      KAFKA_BOOTSTRAP_SERVICES: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-banking-platform-dev-secret-change-in-production-please-use-a-long-random-value}
      AI_MODE: ${AI_MODE:-fallback}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o-mini}
    ports:
      - "8082:8082"
    networks:
      - banking-network

  # ---------------------------------------------------------------------------
  # Fraud Service — 8083 / fraud_db
  # ---------------------------------------------------------------------------
  fraud-service:
    build:
      context: .
      dockerfile: fraud-service/Dockerfile
    container_name: banking-fraud-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fraud_db
      DB_USERNAME: ${DB_USERNAME:-bank}
      DB_PASSWORD: ${DB_PASSWORD:-bankpass}
      KAFKA_BOOTSTRAP_SERVICES: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-banking-platform-dev-secret-change-in-production-please-use-a-long-random-value}
      AI_MODE: ${AI_MODE:-fallback}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o-mini}
    ports:
      - "8083:8083"
    networks:
      - banking-network

  # ---------------------------------------------------------------------------
  # Loan Service — 8084 / loan_db
  # ---------------------------------------------------------------------------
  loan-service:
    build:
      context: .
      dockerfile: loan-service/Dockerfile
    container_name: banking-loan-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/loan_db
      DB_USERNAME: ${DB_USERNAME:-bank}
      DB_PASSWORD: ${DB_PASSWORD:-bankpass}
      KAFKA_BOOTSTRAP_SERVICES: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-banking-platform-dev-secret-change-in-production-please-use-a-long-random-value}
      AI_MODE: ${AI_MODE:-fallback}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o-mini}
    ports:
      - "8084:8084"
    networks:
      - banking-network

  # ---------------------------------------------------------------------------
  # Support Service — 8085 / support_db
  # ---------------------------------------------------------------------------
  support-service:
    build:
      context: .
      dockerfile: support-service/Dockerfile
    container_name: banking-support-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/support_db
      DB_USERNAME: ${DB_USERNAME:-bank}
      DB_PASSWORD: ${DB_PASSWORD:-bankpass}
      KAFKA_BOOTSTRAP_SERVICES: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-banking-platform-dev-secret-change-in-production-please-use-a-long-random-value}
      AI_MODE: ${AI_MODE:-fallback}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o-mini}
    ports:
      - "8085:8085"
    networks:
      - banking-network

  # ---------------------------------------------------------------------------
  # Decision Service — 8086 / decision_db
  # Orchestrates the other agents, hosts the STOMP WebSocket endpoint at /ws.
  # ---------------------------------------------------------------------------
  decision-service:
    build:
      context: .
      dockerfile: decision-service/Dockerfile
    container_name: banking-decision-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/decision_db
      DB_USERNAME: ${DB_USERNAME:-bank}
      DB_PASSWORD: ${DB_PASSWORD:-bankpass}
      KAFKA_BOOTSTRAP_SERVICES: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-banking-platform-dev-secret-change-in-production-please-use-a-long-random-value}
      AI_MODE: ${AI_MODE:-fallback}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o-mini}
      AUTH_SERVICE_URL: http://auth-service:8081
      KYC_SERVICE_URL: http://kyc-service:8082
      FRAUD_SERVICE_URL: http://fraud-service:8083
      LOAN_SERVICE_URL: http://loan-service:8084
      SUPPORT_SERVICE_URL: http://support-service:8085
    ports:
      - "8086:8086"
    networks:
      - banking-network

  # ---------------------------------------------------------------------------
  # API Gateway — 8080
  # Single entry point. Validates JWTs at the edge and routes /api/** and
  # /ws to the downstream services.
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: banking-api-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      kyc-service:
        condition: service_started
      fraud-service:
        condition: service_started
      loan-service:
        condition: service_started
      support-service:
        condition: service_started
      decision-service:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: ${DB_USERNAME:-bank}
      DB_PASSWORD: ${DB_PASSWORD:-bankpass}
      KAFKA_BOOTSTRAP_SERVICES: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-banking-platform-dev-secret-change-in-production-please-use-a-long-random-value}
      AI_MODE: ${AI_MODE:-fallback}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o-mini}
      AUTH_SERVICE_URL: http://auth-service:8081
      KYC_SERVICE_URL: http://kyc-service:8082
      FRAUD_SERVICE_URL: http://fraud-service:8083
      LOAN_SERVICE_URL: http://loan-service:8084
      SUPPORT_SERVICE_URL: http://support-service:8085
      DECISION_SERVICE_URL: http://decision-service:8086
    ports:
      - "8080:8080"
    networks:
      - banking-network

  # ---------------------------------------------------------------------------
  # Frontend — React SPA served by nginx (container port 80, host port 3000)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: banking-frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "3000:80"
    networks:
      - banking-network

volumes:
  pgdata:
    name: banking-pgdata
  redis-data:
    name: banking-redis-data
  kafka-data:
    name: banking-kafka-data

networks:
  banking-network:
    name: banking-network
    driver: bridge
