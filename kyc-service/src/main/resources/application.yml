spring:
  application:
    name: kyc-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kyc_db}
    username: ${DB_USERNAME:bank}
    password: ${DB_PASSWORD:bankpass}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVICES:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: kyc-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
  ai:
    azure:
      openai:
        endpoint: ${AZURE_OPENAI_ENDPOINT:https://placeholder.openai.azure.com/}
        api-key: ${AZURE_OPENAI_API_KEY:placeholder}
        chat:
          options:
            deployment-name: ${AZURE_OPENAI_DEPLOYMENT:gpt-4o}

server:
  port: 8082

jwt:
  secret: ${JWT_SECRET:dev-secret-key-for-ai-banking-platform-2026-change-me}

ai:
  mode: ${AI_MODE:fallback}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
